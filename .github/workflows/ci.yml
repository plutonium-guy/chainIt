name: CI

on:
  push:
    branches: [main, working_barnch]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install maturin pytest numpy

      - name: Build Rust extension
        run: |
          uv run maturin develop --release

      - name: Run tests
        run: |
          uv run pytest tests/ -v

  test-pure-python:
    name: Test (pure Python, no Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install without Rust
        run: |
          uv venv
          uv pip install pytest numpy
          uv pip install -e . --no-build-isolation || uv pip install hatchling && uv pip install -e .

      - name: Run tests (Rust tests will skip)
        run: |
          uv run pytest tests/ -v
