[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stepcraft"
version = "0.2.1"
description = "Composable pipeline framework with graph/DAG support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Amiya Mandal", email = "amiya19mandal@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["pipeline", "pipe", "dag", "graph", "workflow", "chain", "compose"]
dependencies = [
    "beartype>=0.18",
    # uvloop is a fast, stable libuv-based event loop (Unix only). On Windows
    # it is skipped and stepcraft falls back to the stdlib asyncio loop.
    "uvloop>=0.18; sys_platform != 'win32'",
]

[project.optional-dependencies]
numpy = ["numpy"]
numba = ["numba"]
uvloop = ["uvloop>=0.18; sys_platform != 'win32'"]
spec = ["pyyaml"]
all = ["numpy", "numba", "uvloop>=0.18; sys_platform != 'win32'", "pyyaml"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "numpy",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/amiyamandal-dev/stepcraft"
Repository = "https://github.com/amiyamandal-dev/stepcraft"
Issues = "https://github.com/amiyamandal-dev/stepcraft/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stepcraft"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    ".",
]
# Fail a hung test in 60s (and dump its traceback) instead of blocking CI for
# hours. Thread method works cross-platform incl. blocking C calls.
addopts = "--timeout=60 --timeout-method=thread"
filterwarnings = [
    "ignore:.*:beartype.roar.BeartypeDecorHintPep585DeprecationWarning",
]
markers = [
    "uvloop: integration tests that require uvloop installed",
]
