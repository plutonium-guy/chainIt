[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecraft"
version = "0.1.0"
description = "Composable pipeline framework with graph/DAG support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Amiya Mandal", email = "amiya19mandal@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["pipeline", "pipe", "dag", "graph", "workflow", "chain", "compose"]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
numba = ["numba"]
rsloop = ["rsloop"]
spec = ["pyyaml"]
all = ["numpy", "numba", "rsloop", "pyyaml"]

[project.urls]
Homepage = "https://github.com/amiyamandal-dev/chainIt"
Repository = "https://github.com/amiyamandal-dev/chainIt"
Issues = "https://github.com/amiyamandal-dev/chainIt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecraft"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    ".",
]
